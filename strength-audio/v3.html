<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>강점 오디오 v3</title><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0;background:#090b10;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:16px 16px 150px}button,select,input{min-height:48px;border-radius:14px;border:1px solid #333;background:#1e2433;color:#fff;font:inherit;font-weight:700;padding:0 12px}button.on,.play{background:#7cf2b0;color:#06150d}.card,.item{background:#151924;border:1px solid #2a3040;border-radius:18px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.speed{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.title{font-size:24px;font-weight:900}.muted{color:#9ca7b8}audio,select,input{width:100%;margin:10px 0}.sticky{position:fixed;bottom:0;left:0;right:0;background:#090b10;border-top:1px solid #333;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}.prog{display:grid;grid-template-columns:50px 1fr 50px;gap:8px;color:#9ca7b8;font-size:12px}</style></head><body><h1>강점 오디오 v3</h1><div class="muted">iPhone Safari용 source type 수정판</div><div class="card"><div class="title" id="now">로딩...</div><div class="muted" id="meta"></div><audio id="a" controls preload="auto" playsinline webkit-playsinline></audio><div class="row"><button id="prev">이전</button><button id="back">-15초</button><button id="play" class="play">재생</button><button id="fwd">+15초</button><button id="next">다음</button></div><div class="speed" id="speed"></div><select id="vol"><option value="all">전체 81개</option><option value="1">1권</option><option value="2">2권</option><option value="3">3권</option></select><input id="q" placeholder="검색"><p class="muted" id="msg">준비 중</p></div><div id="list"></div><div class="sticky"><div class="prog"><span id="ct">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dt">0:00</span></div><div class="row"><button id="sback">-15초</button><button id="splay" class="play">재생</button><button id="snext">다음</button></div></div><script>let tracks=[],i=+localStorage.saIdx||0,rate=+localStorage.saRate||1.25,auto=true;const $=x=>document.getElementById(x),a=$('a'),rates=[.8,1,1.15,1.25,1.4,1.5,1.65,1.8,2,2.25];function url(id){return`https://drive.google.com/uc?export=open&id=${id}`}function lab(t){return`${t.v}권 ${String(t.c).padStart(2,'0')}장`}function fmt(s){if(!isFinite(s))return'0:00';s=s|0;return`${s/60|0}:${String(s%60).padStart(2,'0')}`}function setSrc(t){a.innerHTML='';let s=document.createElement('source');s.src=url(t.id);s.type='audio/mp4';a.appendChild(s);a.load()}function load(n,p=false){i=Math.max(0,Math.min(tracks.length-1,n));let t=tracks[i];$('now').textContent=lab(t);$('meta').textContent=t.title;$('msg').textContent='오디오 로딩 중...';localStorage.saIdx=i;setSrc(t);a.playbackRate=rate;render();if(p)setTimeout(()=>a.play().catch(e=>$('msg').textContent='재생 실패: '+e.name),350)}function pp(){a.paused?a.play().catch(e=>$('msg').textContent='재생 실패: '+e.name):a.pause()}function jump(x){a.currentTime=Math.max(0,Math.min(a.duration||0,a.currentTime+x))}function render(){let v=$('vol').value,q=$('q').value.toLowerCase();$('list').innerHTML=tracks.filter(t=>(v==='all'||String(t.v)===v)&&(!q||(lab(t)+' '+t.title).toLowerCase().includes(q))).map(t=>`<div class="item"><b>${lab(t)}</b><div class="muted">${t.title}</div><button data-i="${tracks.indexOf(t)}">듣기</button></div>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>load(+b.dataset.i,true))}rates.forEach(r=>$('speed').insertAdjacentHTML('beforeend',`<button data-r="${r}">${r}x</button>`));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;localStorage.saRate=rate;a.playbackRate=rate;document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',+x.dataset.r===rate))});$('play').onclick=$('splay').onclick=pp;$('prev').onclick=()=>load(i-1,true);$('next').onclick=$('snext').onclick=()=>load(i+1,true);$('back').onclick=$('sback').onclick=()=>jump(-15);$('fwd').onclick=()=>jump(15);$('vol').onchange=$('q').oninput=render;$('seek').oninput=()=>{if(isFinite(a.duration))a.currentTime=+$('seek').value/1000*a.duration};a.onloadedmetadata=()=>{$('msg').textContent='준비됨'};a.onerror=()=>{$('msg').textContent='오디오 오류: iPhone이 Drive m4a MIME을 거부했습니다. mp3 변환/재업로드가 필요할 수 있습니다.'};a.ontimeupdate=()=>{if(isFinite(a.duration))$('seek').value=Math.round(a.currentTime/a.duration*1000);$('ct').textContent=fmt(a.currentTime);$('dt').textContent=fmt(a.duration)};a.onplay=a.onpause=()=>{$('play').textContent=$('splay').textContent=a.paused?'재생':'일시정지'};a.onended=()=>{if(i<tracks.length-1)load(i+1,true)};fetch('./audio.json?v=3').then(r=>r.json()).then(d=>{tracks=d.sort((a,b)=>a.v-b.v||a.c-b.c);document.querySelector(`[data-r="${rate}"]`)?.classList.add('on');load(i,false)});</script></body></html>
