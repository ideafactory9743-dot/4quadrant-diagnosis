<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>강점 오디오</title><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="강점오디오"><link rel="manifest" href="./manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:14px 14px 150px}.app{max-width:820px;margin:auto}h1{font-size:24px;margin:8px 0}.muted,.small{color:#9ca7b8}.card,.item{background:#151924;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;margin:10px 0}button,select,input{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#1e2433;color:#f4f7fb;font:inherit;font-weight:750;padding:0 12px}button.primary{background:#7cf2b0;color:#06150d;border:0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.title{font-size:22px;font-weight:850;margin:8px 0}.speed{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}.active{outline:2px solid #7cf2b0;color:#7cf2b0}audio,select,input{width:100%;margin:8px 0}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.cur{border-color:#7cf2b0;background:rgba(124,242,176,.1)}.num{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.08);color:#7cf2b0;font-weight:900}.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(9,11,16,.95);border-top:1px solid rgba(255,255,255,.1);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.stickin{max-width:820px;margin:auto}.prog{display:grid;grid-template-columns:50px 1fr 50px;gap:8px;align-items:center;font-size:12px;color:#9ca7b8}@media(max-width:520px){.speed{grid-template-columns:repeat(4,1fr)}.item{grid-template-columns:auto 1fr}.item button{grid-column:1/-1}}</style></head><body><main class="app"><h1>강점 오디오 운동 플레이어 v2</h1><div class="muted">iPhone용 수정판 · 배속 · 연속재생 · 마지막 위치 저장</div><section class="card"><div class="title" id="now">불러오는 중...</div><div class="muted" id="meta"></div><audio id="a" controls preload="metadata" playsinline></audio><div class="row"><button id="prev">이전</button><button id="back">-15초</button><button id="play" class="primary">재생</button><button id="fwd">+15초</button><button id="next">다음</button></div><div class="speed" id="speeds"></div><div class="row"><button id="auto" class="active">연속재생 켜짐</button><button id="resume">저장 위치로</button></div><select id="vol"><option value="all">전체 81개</option><option value="1">1권</option><option value="2">2권</option><option value="3">3권</option></select><input id="q" placeholder="검색: 1권 03, volume2, chapter15"><div class="small" id="msg">Drive 폴더가 링크 공개 상태여야 재생됩니다.</div></section><section id="list"></section></main><div class="sticky"><div class="stickin"><div class="prog"><span id="ct">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dt">0:00</span></div><div class="row"><button id="sback">-15초</button><button id="splay" class="primary">재생</button><button id="snext">다음</button></div></div></div><script>let tracks=[],i=+localStorage.saIdx||0,rate=+localStorage.saRate||1.25,auto=localStorage.saAuto!=='false';const $=id=>document.getElementById(id),a=$('a'),sp=[.8,1,1.15,1.25,1.4,1.5,1.65,1.8,2,2.25];function src(id){return`https://drive.google.com/uc?export=open&id=${id}`}function lab(t){return`${t.v}권 ${String(t.c).padStart(2,'0')}장`}function fmt(s){if(!isFinite(s))return'0:00';s=Math.max(0,s|0);let h=s/3600|0,m=s%3600/60|0;return h?`${h}:${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${m}:${String(s%60).padStart(2,'0')}`}function save(){localStorage.saIdx=i;localStorage.saRate=a.playbackRate;if(tracks[i])localStorage['pos_'+tracks[i].id]=a.currentTime||0}function load(n,p=false,r=true){i=Math.max(0,Math.min(tracks.length-1,n));let t=tracks[i];a.pause();a.removeAttribute('src');a.load();a.src=src(t.id);a.type='audio/mp4';a.playbackRate=rate;$('now').textContent=lab(t);$('meta').textContent=t.title;$('msg').textContent='불러오는 중...';localStorage.saIdx=i;render();if(r)a.onloadedmetadata=()=>{let pos=+localStorage['pos_'+t.id]||0;if(pos>0&&pos<a.duration-2)a.currentTime=pos;$('msg').textContent='준비됨'};if(p)setTimeout(()=>a.play().catch(e=>$('msg').textContent='재생 실패: '+e.name+' - Drive 권한/브라우저 캐시를 확인하세요.'),200)}function pp(){a.paused?a.play().catch(e=>$('msg').textContent='재생 실패: '+e.name+' - 새로고침 후 다시 시도하세요.'):a.pause()}function jump(x){a.currentTime=Math.max(0,Math.min(a.duration||0,a.currentTime+x))}function next(){load(i+1,true,false)}function prev(){load(i-1,true,false)}function setRate(x){rate=x;a.playbackRate=x;localStorage.saRate=x;document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',+b.dataset.r===x))}function render(){let v=$('vol').value,q=$('q').value.toLowerCase().trim();$('list').innerHTML=tracks.filter(t=>(v==='all'||String(t.v)===v)&&(!q||`${lab(t)} ${t.title} volume${t.v} chapter${String(t.c).padStart(2,'0')}`.toLowerCase().includes(q))).map(t=>{let n=tracks.indexOf(t);return`<div class="item ${n===i?'cur':''}"><div class="num">${t.v}-${String(t.c).padStart(2,'0')}</div><div><b>${lab(t)}</b><div class="small">${t.title}</div></div><button data-i="${n}">듣기</button></div>`}).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>load(+b.dataset.i,true,true))}sp.forEach(x=>$('speeds').insertAdjacentHTML('beforeend',`<button data-r="${x}">${x}x</button>`));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));$('play').onclick=$('splay').onclick=pp;$('next').onclick=$('snext').onclick=next;$('prev').onclick=prev;$('back').onclick=$('sback').onclick=()=>jump(-15);$('fwd').onclick=()=>jump(15);$('resume').onclick=()=>{let p=+localStorage['pos_'+tracks[i].id]||0;if(p)a.currentTime=p};$('auto').onclick=()=>{auto=!auto;localStorage.saAuto=auto;$('auto').textContent=auto?'연속재생 켜짐':'연속재생 꺼짐';$('auto').classList.toggle('active',auto)};$('vol').onchange=$('q').oninput=render;$('seek').oninput=()=>{if(isFinite(a.duration))a.currentTime=(+$('seek').value/1000)*a.duration};a.ontimeupdate=()=>{if(isFinite(a.duration))$('seek').value=Math.round(a.currentTime/a.duration*1000);$('ct').textContent=fmt(a.currentTime);$('dt').textContent=fmt(a.duration);if((a.currentTime|0)%5===0)save()};a.onplay=a.onpause=()=>{$('play').textContent=$('splay').textContent=a.paused?'재생':'일시정지'};a.onerror=()=>{$('msg').textContent='오디오 로딩 오류: Drive 파일이 아직 비공개이거나 Safari가 캐시를 보고 있습니다.'};a.onended=()=>{save();if(auto&&i<tracks.length-1)next()};window.onbeforeunload=save;fetch('./audio.json?v=2').then(r=>r.json()).then(d=>{tracks=d.sort((a,b)=>a.v-b.v||a.c-b.c);setRate(rate);$('auto').textContent=auto?'연속재생 켜짐':'연속재생 꺼짐';$('auto').classList.toggle('active',auto);load(i,false,true)});</script></body></html>
